name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:ci
  dist:
    name: Check dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check-dist
  smoke:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: greeting
        uses: ./
        with:
          name: GitHub
      - id: default
        uses: ./
      - name: Verify outputs
        env:
          GREETING: ${{ steps.greeting.outputs.greeting }}
          DEFAULT_GREETING: ${{ steps.default.outputs.greeting }}
        run: |
          test "$GREETING" = 'Hello, GitHub!'
          test "$DEFAULT_GREETING" = 'Hello, World!'
