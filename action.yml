name: TypeScript Greeting
description: A minimal TypeScript action that greets a name.
author: makeitstrict
branding:
  icon: message-circle
  color: blue
inputs:
  name:
    description: The name to greet.
    required: true
    default: World
outputs:
  greeting:
    description: The greeting message.
runs:
  using: node24
  main: dist/index.js
